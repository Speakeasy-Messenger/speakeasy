appId: xyz.speakeasyapp.app
name: Peer DM round-trip and Android IME layout (Tier B)
---

- clearState
- launchApp
- tapOn:
    text: "Wait"
    optional: true

- runFlow:
    file: _enroll-with-handle.yaml
    env:
      HANDLE: tester02

# NEW-CONVERSATION.md §3: FAB opens the Find Someone sheet
# directly. The handle input is auto-focused, so we just type. Once
# the lookup resolves, the result card appears with testID
# `find-sheet-result` — tapping it opens the chat (no separate
# "Start chat" button anymore).
#
# Flow 01 enrolled tester01 into the same in-memory API server. Looking
# up that peer while the keyboard stays open is the API 36 regression
# guard: the result card must remain visible above the IME.
- tapOn:
    id: "conversations-fab"
- tapOn:
    id: "find-sheet-input"
- inputText: "tester01"
- assertVisible:
    id: "find-sheet-result"
- tapOn:
    id: "find-sheet-result"

# Send a message. Send button is an accent arrow icon (testID
# `chat-send`) that only renders once the input has content — brand
# §6.5. Type input first, then tap by id (the button has no visible
# text label any more).
- tapOn:
    id: "chat-input"
- inputText: "Hello peer!"
- assertVisible:
    id: "chat-send"
- tapOn:
    id: "chat-send"

- assertVisible:
    text: "Hello peer!"

- back

- assertVisible:
    text: "Hello peer!"
