name: Coordinated Mobile Beta Release

# A single tag now builds Android once while iOS archives in parallel.
# Publication is still ordered: Android reaches Play beta first, then the
# already-built IPA uploads to TestFlight. alpha-* tags remain Android
# Internal-only release candidates; v* tags run the complete beta sequence.

on:
  push:
    tags: ['alpha-*', 'v*']

concurrency:
  group: mobile-beta-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Assert the tag is on main
        run: |
          git fetch --no-tags --depth=200 origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "✅ $GITHUB_SHA is on main"
          else
            echo "::error::Release tag ${GITHUB_REF##*/} is not an ancestor of origin/main. Merge to main, then re-tag."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-release-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        run: npm run build

      - name: Build signed APK and AAB together
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VOUCHFLOW_WRITE_KEY: ${{ secrets.VOUCHFLOW_WRITE_KEY }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$VOUCHFLOW_WRITE_KEY" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Android release secrets are incomplete."
            exit 1
          fi
          keystore="$RUNNER_TEMP/speakeasy-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon \
            -Pvouchflow.apiKey="$VOUCHFLOW_WRITE_KEY" \
            -Pvouchflow.environment=production \
            -PRELEASE_STORE_FILE="$keystore"

      - name: Assert APK signing and artifact versions
        run: |
          tag="${GITHUB_REF##*/}"
          case "$tag" in
            v*-hotfix.*)
              base_name="${tag#v}"; expected_name="${base_name%-hotfix.*}"
              hf="${tag##*-hotfix.}"; sub=$((999 + 10#$hf)) ;;
            v*) expected_name="${tag#v}"; sub=999 ;;
            *) expected_name="${tag#alpha-}"; sub="${tag##*-rc.}" ;;
          esac
          IFS=. read -r MA MI PA <<< "${expected_name%%-*}"
          expected_code=$(( (10#$MA * 10000 + 10#$MI * 100 + 10#$PA) * 1000 + 10#$sub ))
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          aab="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"

          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed."
            exit 1
          fi

          aapt=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt -type f -executable | sort -V | tail -1)
          badging=$("$aapt" dump badging "$apk")
          apk_name=$(echo "$badging" | grep -oP "versionName='\K[^']+")
          apk_code=$(echo "$badging" | grep -oP "versionCode='\K[^']+")

          BUNDLETOOL_VERSION=1.18.1
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL -o "$bundletool" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          aab_name=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)
          aab_code=$(java -jar "$bundletool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)

          echo "Expected: $expected_name ($expected_code)"
          echo "APK:      $apk_name ($apk_code)"
          echo "AAB:      $aab_name ($aab_code)"
          if [ "$apk_name" != "$expected_name" ] || [ "$apk_code" != "$expected_code" ] || \
             [ "$aab_name" != "$expected_name" ] || [ "$aab_code" != "$expected_code" ]; then
            echo "::error::A release artifact version does not match the tag."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-${{ github.ref_name }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Rename APK with version tag
        id: rename
        run: |
          out="speakeasy-${GITHUB_REF##*/}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$out"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF##*/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.rename.outputs.apk }}" --clobber
          else
            gh release create "$tag" "${{ steps.rename.outputs.apk }}" \
              --title "$tag" --notes "Mobile artifacts built by the coordinated release workflow."
          fi

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/480139204146/locations/global/workloadIdentityPools/github-actions-pool/providers/github
          service_account: fastlane-play-publisher@speakeasy-mobile-497702.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Internal App Sharing
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PACKAGE_NAME: xyz.speakeasyapp.app
          AAB_PATH: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          RELEASE_NAME: ${{ github.ref_name }}
        run: bash scripts/play-internal-share.sh

      - name: Publish to Play Internal
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PACKAGE_NAME: xyz.speakeasyapp.app
          AAB_PATH: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          TRACK: internal
          RELEASE_NAME: ${{ github.ref_name }}
          RELEASE_STATUS: completed
        run: bash scripts/play-publish.sh

      - name: Promote Android to beta
        if: startsWith(github.ref_name, 'v')
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          PACKAGE_NAME: xyz.speakeasyapp.app
          FROM_TRACK: internal
          TO_TRACK: beta
          RELEASE_STATUS: completed
        run: bash scripts/play-promote-track.sh

  ios-archive:
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Assert the tag is on main
        run: |
          git fetch --no-tags --depth=200 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tag is not on main."; exit 1;
          }

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Cache libsignal prebuilt FFI
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.signal.libsignal
          key: libsignal-${{ runner.os }}-v0.59.0

      - name: Install dependencies and build workspace
        run: |
          npm ci
          npm run build

      - name: Write production iOS configuration
        working-directory: apps/mobile/ios/Speakeasy
        env:
          VOUCHFLOW_WRITE_KEY: ${{ secrets.VOUCHFLOW_WRITE_KEY }}
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        run: |
          if [ -z "$VOUCHFLOW_WRITE_KEY" ] || [ -z "$FIREBASE_IOS_PLIST_B64" ]; then
            echo "::error::iOS release configuration secrets are incomplete."; exit 1
          fi
          sed -e "s|vsk_sandbox_replace_with_real_key|${VOUCHFLOW_WRITE_KEY}|" \
              -e "s|<string>sandbox</string>|<string>production</string>|" \
              Vouchflow.plist.example > Vouchflow.plist
          echo "$FIREBASE_IOS_PLIST_B64" | base64 --decode > GoogleService-Info.plist
          plutil -lint Vouchflow.plist GoogleService-Info.plist

      - name: Wire iOS project
        working-directory: apps/mobile/ios
        run: |
          gem install xcodeproj --no-document
          ruby tools/wire-ios-project.rb

      - name: Set up SSH key for match
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          if [ -z "$MATCH_DEPLOY_KEY" ]; then
            echo "::error::MATCH_DEPLOY_KEY is not set."; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/match_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Install fastlane and CocoaPods
        working-directory: apps/mobile/ios
        run: bundle install

      - name: Install pods
        working-directory: apps/mobile/ios
        run: USE_FRAMEWORKS=static pod install

      - name: Build signed TestFlight IPA
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_id }}
        run: bundle exec fastlane ios build_beta

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa-${{ github.ref_name }}
          path: apps/mobile/ios/build/Speakeasy.ipa
          retention-days: 1
          if-no-files-found: error

  ios-testflight:
    if: startsWith(github.ref_name, 'v')
    needs: [android-release, ios-archive]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download prebuilt IPA
        uses: actions/download-artifact@v4
        with:
          name: testflight-ipa-${{ github.ref_name }}
          path: testflight-ipa

      - name: Install fastlane
        working-directory: apps/mobile/ios
        run: bundle install

      - name: Upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IPA_PATH: ${{ github.workspace }}/testflight-ipa/Speakeasy.ipa
          TESTFLIGHT_EXTERNAL_GROUPS: Friends
        run: bundle exec fastlane ios upload_beta
