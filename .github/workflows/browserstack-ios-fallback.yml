name: BrowserStack iOS email-fallback harness

# Produces the signed IPA + Maestro suite used to prove the Vouchflow
# email-OTP onboarding fallback on a real iPad (App Store 2.1(a) fix, #206).
#
# Deliberately NOT the `browserstack` fastlane lane: that one defines
# SPEAKEASY_VIDEO_CALL_HARNESS, which boots straight into the call harness
# and never renders onboarding. This uses `build_beta`, i.e. the ordinary
# App Store binary — the fallback has to be proven on the build a reviewer
# would actually get, not on a test-only variant.
#
# BrowserStack credentials stay in Trusty Squire; this workflow only handles
# Apple signing and exposes the IPA + flows as a short-lived Actions
# artifact for upload through that vaulted session.

on:
  workflow_dispatch:

concurrency:
  group: browserstack-ios-fallback-harness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-harness:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select compatible Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Cache libsignal prebuilt FFI
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.signal.libsignal
          key: libsignal-${{ runner.os }}-v0.59.0

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Write Vouchflow.plist
        env:
          VOUCHFLOW_WRITE_KEY: ${{ secrets.VOUCHFLOW_WRITE_KEY }}
        working-directory: apps/mobile/ios/Speakeasy
        run: |
          test -n "$VOUCHFLOW_WRITE_KEY"
          sed -e "s|vsk_sandbox_replace_with_real_key|${VOUCHFLOW_WRITE_KEY}|" \
              -e "s|<string>sandbox</string>|<string>production</string>|" \
              Vouchflow.plist.example > Vouchflow.plist
          plutil -lint Vouchflow.plist

      - name: Write GoogleService-Info.plist
        env:
          FIREBASE_IOS_PLIST_B64: ${{ secrets.FIREBASE_IOS_PLIST_B64 }}
        working-directory: apps/mobile/ios/Speakeasy
        run: |
          test -n "$FIREBASE_IOS_PLIST_B64"
          echo "$FIREBASE_IOS_PLIST_B64" | base64 --decode > GoogleService-Info.plist
          plutil -lint GoogleService-Info.plist

      - name: Wire iOS project
        working-directory: apps/mobile/ios
        run: |
          gem install xcodeproj --no-document
          ruby tools/wire-ios-project.rb

      - name: Set up match SSH key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          test -n "$MATCH_DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_key
          chmod 600 ~/.ssh/match_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "Host github.com"
            echo "  IdentityFile ~/.ssh/match_key"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Install Ruby dependencies and pods
        working-directory: apps/mobile/ios
        run: |
          bundle install
          USE_FRAMEWORKS=static pod install

      - name: Build signed IPA
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane ios build_beta

      - name: Package BrowserStack Maestro suite
        working-directory: apps/mobile
        run: |
          mkdir -p build/maestro/speakeasy-ios-fallback
          cp maestro/13-email-fallback-enroll-ios.yaml build/maestro/speakeasy-ios-fallback/
          cp maestro/_email-fallback-otp.yaml build/maestro/speakeasy-ios-fallback/
          cd build/maestro
          zip -qr ../speakeasy-ios-fallback.zip speakeasy-ios-fallback

      - name: Upload harness artifact
        uses: actions/upload-artifact@v6
        with:
          name: speakeasy-browserstack-ios-fallback-${{ github.sha }}
          path: |
            apps/mobile/ios/build/Speakeasy.ipa
            apps/mobile/build/speakeasy-ios-fallback.zip
          if-no-files-found: error
          retention-days: 3
