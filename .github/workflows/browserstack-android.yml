name: BrowserStack Android call harness

# Builds an installable, debug-signed RELEASE-mode APK. Release mode embeds the
# JS bundle (unlike assembleDebug, which expects Metro), while debug signing is
# appropriate because this artifact is uploaded only to BrowserStack and never
# to Play. The native BuildConfig switch boots directly into the real video-call
# screen backed by the loopback WebRTC media harness.

on:
  workflow_dispatch:

concurrency:
  group: browserstack-android-call-harness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: browserstack-gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            browserstack-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Install and verify
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run test

      - name: Build bundled BrowserStack harness APK
        working-directory: apps/mobile/android
        env:
          VOUCHFLOW_WRITE_KEY: ${{ secrets.VOUCHFLOW_WRITE_KEY }}
        run: |
          test -n "$VOUCHFLOW_WRITE_KEY"
          ./gradlew :app:assembleRelease --no-daemon \
            -Pvouchflow.apiKey="$VOUCHFLOW_WRITE_KEY" \
            -Pspeakeasy.videoCallHarness=true

      - name: Package BrowserStack Maestro suite
        working-directory: apps/mobile
        run: |
          mkdir -p build/maestro/speakeasy-android-calls
          cp maestro/21-call-pip-android.yaml build/maestro/speakeasy-android-calls/
          cd build/maestro
          zip -qr ../speakeasy-android-calls.zip speakeasy-android-calls

      - uses: actions/upload-artifact@v7
        with:
          name: speakeasy-browserstack-android-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/build/speakeasy-android-calls.zip
          if-no-files-found: error
          retention-days: 3

